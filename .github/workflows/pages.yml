name: Publicar Conta Clara

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter ficheiros da aplicação
        uses: actions/checkout@v4
      - name: Preparar site estático
        run: |
          mkdir -p dist/vendor
          cp index.html app.js styles.css statement-import.js market-quotes.js manifest.webmanifest icon.svg dist/
          sed "s|const CACHE_NAME = .*|const CACHE_NAME = \"conta-clara-app-${GITHUB_SHA}\";|" service-worker.js > dist/service-worker.js
          cp -R vendor/. dist/vendor/
          touch dist/.nojekyll
      - name: Carregar artefacto GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
